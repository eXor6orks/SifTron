[workspace]
resolver = "2"
members = ["crates/vectordb-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eXor6orks/SifTron"

[workspace.dependencies]
proptest = "1"
serde_json = "1"

[package]
name = "siftron"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SifTron CLI entry point — interactive playground for the vector index"

[[bin]]
name = "siftron"
path = "src/main.rs"

[dependencies]
vectordb-core = { path = "crates/vectordb-core" }
